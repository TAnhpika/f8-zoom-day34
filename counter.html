<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Counter App</title>
        <style>
            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                background: #f4f7fb;
                font-family: Arial, sans-serif;
                color: #1f2937;
            }

            .container {
                text-align: center;
                background: #ffffff;
                padding: 32px;
                border-radius: 24px;
                box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
                width: min(100%, 360px);
            }

            .counter-value {
                font-size: 4rem;
                margin: 0 0 24px;
            }

            button {
                padding: 12px 22px;
                border: none;
                border-radius: 999px;
                cursor: pointer;
                font-weight: 600;
                transition:
                    transform 0.2s ease,
                    background-color 0.2s ease;
                margin: 0 8px;
            }

            button.increase {
                background: #2c7be5;
                color: #fff;
            }

            button.decrease {
                background: #f736d7;
                color: #111827;
            }

            button:hover {
                transform: translateY(-2px);
            }

            .positive {
                color: green;
            }

            .negative {
                color: red;
            }

            .zero {
                color: gray;
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <script
            crossorigin
            src="https://unpkg.com/react@18/umd/react.development.js"
        ></script>
        <script
            crossorigin
            src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
        ></script>
        <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

        <script type="text/babel">
            function Counter() {
                const [count, setCount] = React.useState(0);
                return (
                    <div className="container">
                        <h2
                            className={`counter-value ${
                                count > 0
                                    ? "positive"
                                    : count < 0
                                      ? "negative"
                                      : "zero"
                            }`}
                        >
                            {count}
                        </h2>
                        <button
                            className="increase"
                            onClick={() => setCount(count + 1)}
                        >
                            Increase
                        </button>
                        <button
                            className="decrease"
                            onClick={() => setCount(count - 1)}
                        >
                            Decrease
                        </button>
                    </div>
                );
            }
            const app = (
                <>
                    <Counter />
                </>
            );
            const root = ReactDOM.createRoot(document.querySelector("#root"));
            root.render(app);
        </script>
    </body>
</html>
